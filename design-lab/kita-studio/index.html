 <div class="composer-area" id="composerArea"><div class="composer-wrap"><div class="context-line" id="contextLine" hidden></div><div class="composer"><div class="input-row"><label for="prompt" class="sr-only">Message Kita</label><textarea id="prompt" rows="1" placeholder="What’s on your mind?"></textarea><button class="icon-button attach" data-action="attach" aria-label="Attach a document" title="Attach a document" data-icon="attach"></button></div><div class="composer-bottom"><button class="model-trigger" data-action="models" aria-label="Choose model"><span class="model-dot" data-icon="spark"></span><span class="model-name" id="modelName">Claude Sonnet</span><span data-icon="chevron"></span></button><button class="tools-trigger" data-action="tools"><span data-icon="settings"></span>Tools<span class="tool-count" id="toolCount" hidden>0</span></button><button class="send" id="send" aria-label="Send message" disabled data-icon="up"></button></div></div><p class="composer-foot"><span data-icon="info"></span>Design preview. Replies are simulated; no AI requests.</p></div></div>
</main>
</div>
<input type="file" id="fileInput" accept=".txt,.md,.pdf,.docx,.html,.js,.json,.csv" multiple hidden>
<div class="modal-layer" id="modalLayer" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="sr-only" role="status" aria-live="polite" id="announcer"></div>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const icon=(name,cls='')=>`<svg class="icon ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const mark=(cls='mark')=>`<svg class="${cls}" viewBox="0 0 40 40" aria-hidden="true"><use href="#i-mark"/></svg>`;
function hydrate(root=document){$$('[data-icon]',root).forEach(e=>{e.innerHTML=icon(e.dataset.icon);e.removeAttribute('data-icon')})}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let appearance='system';try{appearance=localStorage.getItem('kita-studio-appearance')||'system'}catch(e){}
const state={page:'home',chat:null,model:'sonnet',search:false,thinking:false,depth:'Balanced',skill:'Auto',project:null,attachments:[],generating:false,settingsTab:'connections',libraryTab:'all',fontSize:'Default',theme:appearance};
const models=[{id:'sonnet',name:'Claude Sonnet',provider:'Anthropic',desc:'Thoughtful writing & code',context:'200K',letter:'A'},{id:'gpt',name:'GPT-4.1',provider:'OpenAI',desc:'Versatile, clear & capable',context:'1M',letter:'O'},{id:'gemini',name:'Gemini 2.5 Pro',provider:'Google',desc:'Long documents & exploration',context:'1M',letter:'G'},{id:'deepseek',name:'DeepSeek V3',provider:'DeepSeek',desc:'Everyday work & development',context:'128K',letter:'D'}];
const projects=[{id:'studio',name:'Studio website',description:'A small home for a thoughtful design practice.',chats:3},{id:'notes',name:'Things I’m learning',description:'Ideas, reading notes and useful questions.',chats:5}];
const library=[{id:'artifact-1',type:'artifact',name:'A quieter landing page',description:'HTML · Studio website',content:'artifact'},{id:'prompt-1',type:'prompt',name:'Make this clearer',description:'A useful second pair of eyes.',content:'Help me make this clearer. Keep my voice, simplify the structure, and explain what you changed.'},{id:'prompt-2',type:'prompt',name:'Think it through',description:'Explore an idea before getting to work.',content:'Help me think through an idea. Ask three useful questions before suggesting a direction.'}];
const chats=[{id:'landing',title:'A quieter landing page',time:'Today',kind:'artifact',projectId:'studio',messages:[{role:'user',text:'Design a simple landing page for a creative studio. Make it feel thoughtful, natural, and a little different.'},{role:'assistant',kind:'artifact'}]},{id:'ideas',title:'Finding the right words',time:'Today',kind:'writing',messages:[{role:'user',text:'Help me introduce a small design studio without sounding like every other agency.'},{role:'assistant',kind:'writing'}]},{id:'reading',title:'Notes from a good read',time:'Yesterday',kind:'general',messages:[{role:'user',text:'How can I turn reading notes into ideas I actually use?'},{role:'assistant',kind:'general'}]}];
let serial=0, generationTimer=null, toastTimer=null, previousFocus=null, activeModal=null, artifactTab='preview', artifactMobile=false, lastNavFocus=null, navMainInert=false;
const artifactHTML=`<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#f5f5ed;color:#253e34;font-family:Georgia,serif}header{padding:24px 7%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #253e3425}header strong{font-size:24px;letter-spacing:-1px}header span{font:11px Arial;letter-spacing:.4px}.hero{padding:70px 7% 55px;display:grid;grid-template-columns:1.15fr 1fr;gap:34px;align-items:center}h1{font-size:clamp(38px,6vw,74px);font-weight:400;line-height:1.02;letter-spacing:-2px;margin:0 0 24px}p{font:14px/1.8 Arial;max-width:310px;color:#59695f}.label{font:11px Arial;display:flex;align-items:center;gap:8px;margin-bottom:26px}.dot{width:6px;height:6px;background:#517c5b;border-radius:50%}.link{display:inline-block;border-bottom:1px solid #253e34;padding:10px 0;font:13px Arial;margin-top:10px}.art{height:320px;background:#dce4d8;border-radius:130px 130px 6px 6px;position:relative;overflow:hidden;isolation:isolate}.shape{position:absolute;width:85px;height:220px;border-radius:100%;background:#56775a;transform:rotate(34deg);top:70px;left:45%}.shape:before{content:'';position:absolute;width:85px;height:200px;border-radius:100%;background:#91a68b;transform:rotate(-70deg);top:40px;left:-65px}.shape:after{content:'';position:absolute;width:2px;height:270px;background:#253e34;transform:rotate(-10deg);top:50px;left:35px}.art .circle{position:absolute;width:140px;height:140px;right:-30px;top:-30px;border-radius:50%;background:#b7c8aa}.note{position:absolute;bottom:20px;left:20px;font:10px Arial;color:#253e34;z-index:2}footer{margin:0 7%;padding:22px 0;border-top:1px solid #253e3430;display:flex;justify-content:space-between;font:11px Arial;color:#59695f}@media(max-width:480px){header{padding:20px 7%}.hero{padding:40px 7% 34px;grid-template-columns:1fr;gap:25px}h1{font-size:48px;max-width:280px}.art{height:230px;border-radius:120px 120px 4px 4px}.shape{top:35px}.label{margin-bottom:20px}footer{font-size:10px;gap:15px}}</style></head><body><header><strong>still.</strong><span>Independent design studio</span></header><main class="hero"><div><div class="label"><span class="dot"></span>A considered approach</div><h1>Good things<br>take shape.</h1><p>We help thoughtful businesses find their form. Clear identities and digital spaces, made with care.</p><span class="link">A little about our practice</span></div><div class="art" role="img" aria-label="Abstract botanical composition"><div class="circle"></div><div class="shape"></div><span class="note">Rooted in a simpler idea.</span></div></main><footer><span>Strategy · Identity · Digital</span><span>Made slowly. Made well.</span></footer></body></html>`;
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,3200)}
function announce(text){$('#announcer').textContent=text}
function applyTheme(value){state.theme=value;const dark=value==='system'?matchMedia('(prefers-color-scheme: dark)').matches:value==='dark';document.documentElement.dataset.theme=dark?'dark':'light';document.querySelector('meta[name="theme-color"]').content=dark?'#15171d':'#f4f5f8';try{localStorage.setItem('kita-studio-appearance',value)}catch(e){}$$('[data-action="theme"]').forEach(b=>{b.innerHTML=icon(dark?'sun':'moon');b.setAttribute('aria-label',dark?'Switch to light theme':'Switch to dark theme')})}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(state.theme==='system')applyTheme('system')});
function toggleTheme(){applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');if(activeModal==='settings'&&state.settingsTab==='appearance')renderSettingsContent()}
function renderHistory(){const q=$('#historySearch').value.trim().toLowerCase();let group='';$('#history').innerHTML=chats.filter(c=>c.title.toLowerCase().includes(q)).map(c=>{const head=group===c.time?'':`<div class="history-group">${esc(c.time)}</div>`;group=c.time;return head+`<button data-chat="${esc(c.id)}" class="${state.chat===c.id?'selected':''}" ${state.chat===c.id?'aria-current="page"':''}><span class="history-title">${esc(c.title)}</span>${c.id==='landing'?'<small>Studio website</small>':''}</button>`}).join('')||'<p class="empty-list small">No matching conversations.</p>'}
function openNav(){if(innerWidth>760)return;lastNavFocus=document.activeElement;$('#sidebar').classList.add('open');$('#drawerScrim').classList.add('open');$('#sidebar').inert=false;$('#sidebar').setAttribute('role','dialog');$('#sidebar').setAttribute('aria-modal','true');$('.mobile-menu').setAttribute('aria-expanded','true');$('#main').inert=true;navMainInert=true;$('.sidebar-close').focus()}
function closeNav(restore=true){$('#sidebar').classList.remove('open');$('#drawerScrim').classList.remove('open');$('#sidebar').removeAttribute('role');$('#sidebar').removeAttribute('aria-modal');$('.mobile-menu').setAttribute('aria-expanded','false');$('#main').inert=false;navMainInert=false;if(innerWidth<=760)$('#sidebar').inert=true;if(restore&&lastNavFocus?.isConnected)lastNavFocus.focus()}
function syncSidebar(){if(innerWidth>760){closeNav(false);$('#sidebar').inert=false}else if(!$('#sidebar').classList.contains('open'))$('#sidebar').inert=true}
function stopGeneration(silent=false){if(!state.generating)return;clearInterval(generationTimer);generationTimer=null;const chat=chats.find(c=>c.id===state.chat),m=chat?.messages.at(-1);if(m?.streaming){m.streaming=false;m.stopped=true}state.generating=false;updateComposer();if(!silent){renderChat();announce('Demo response stopped.');toast('Stopped. Your partial response is kept.')}}
function focusPage(){$('#page').focus({preventScroll:true})}
function navigate(page){stopGeneration(true);closeNav(false);state.page=page;state.chat=null;state.project=null;state.attachments=[];$('#prompt').value='';render();$('#viewport').scrollTop=0;focusPage()}
function newChat(){navigate('home');if(innerWidth>760)$('#prompt').focus()}
function openChat(id){const c=chats.find(x=>x.id===id);if(!c)return;stopGeneration(true);closeNav(false);state.page='chat';state.chat=id;state.project=c.projectId||null;state.attachments=[];$('#prompt').value='';render();$('#viewport').scrollTop=0;focusPage()}
function render(){const isConversation=state.page==='home'||state.page==='chat';$('#composerArea').hidden=!isConversation;$$('[data-page]').forEach(b=>{const active=b.dataset.page===(state.page==='chat'?'home':state.page);b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('#headerTitle').textContent=state.page==='home'?(innerWidth<=760?'Kita Chat':'Your workspace'):state.page==='chat'?(chats.find(c=>c.id===state.chat)?.title||'New chat'):state.page==='projects'?'Projects':'Library';$('#headerSubtitle').textContent=state.page==='home'?'A little room to think.':state.page==='chat'?'Your conversation':state.page==='projects'?'Keep the context together.':'Good ideas, kept close.';if(state.page==='home')renderHome();else if(state.page==='chat')renderChat();else if(state.page==='projects')renderProjects();else renderLibrary();renderHistory();updateCounts();updateComposer()}
function renderHome(){const project=projects.find(p=>p.id===state.project);$('#page').innerHTML=`<section class="home">${mark('mark welcome-mark')}<p class="greeting">${project?'Working in '+esc(project.name):'A fresh thought starts here.'}</p><h1>${project?'Let’s make<br>something of it.':'A little space<br>for your next idea.'}</h1><p class="intro">${project?esc(project.description):'Think it through. Find the words. Build something that feels like you.'}</p><div class="starters"><button class="starter" data-starter="writing"><span class="starter-icon">${icon('pen')}</span><span><strong>Find the right words</strong><small>Turn a rough thought into a clear story</small></span>${icon('arrow','arrow')}</button><button class="starter" data-starter="artifact"><span class="starter-icon">${icon('code')}</span><span><strong>Make something real</strong><small>Go from an idea to a working first draft</small></span>${icon('arrow','arrow')}</button><button class="starter" data-starter="general"><span class="starter-icon">${icon('think')}</span><span><strong>Look at it differently</strong><small>A fresh angle on what you’re exploring</small></span>${icon('arrow','arrow')}</button></div><div class="resume"><p class="section-title">Pick up where you left off</p><button class="resume-item" data-chat="landing"><span class="resume-thumb"><span class="mini-site" style="display:block"></span></span><span><strong>A quieter landing page</strong><small>Studio website · Earlier today</small></span>${icon('arrow')}</button></div></section>`}
function artifactCard(){return `<button class="artifact-card" data-action="artifact"><span class="artifact-icon">${icon('code')}</span><span><strong>A quieter landing page</strong><small>Interactive HTML · Ready to explore</small></span><span class="open-artifact"><span>Open preview</span>${icon('expand')}</span></button>`}
function responseHTML(kind){if(kind==='artifact')return `<p>Let’s give the studio room to breathe. I’ve taken a quieter direction: a soft botanical palette, confident type, and one clear story.</p><h2>Thoughtful by design.</h2><p>The page opens with <strong>“Good things take shape.”</strong> It feels like an invitation, rather than another pitch.</p>${artifactCard()}<h3>A few deliberate choices</h3><ul><li><strong>Less, but better.</strong> A short introduction instead of competing sections.</li><li><strong>A natural rhythm.</strong> Generous spacing and an abstract botanical form.</li><li><strong>Made for small screens.</strong> The layout stacks without losing its character.</li></ul><p>Open the preview to explore it, or tell me what you’d like to change.</p>`;if(kind==='writing')return `<p>A good introduction doesn’t have to say everything. It just needs to make the right person want to know more.</p><h2>Start with what you believe.</h2><blockquote>We’re a small studio for ideas worth making.<br>Clear identities. Useful digital spaces.<br>Thoughtfully put together.</blockquote><p>This works because it sounds like a person, not a pitch. It gives the reader a sense of your approach without reaching for words like “innovative” or “world-class”.</p><h3>Keep these three things</h3><ul><li><strong>A clear point of view.</strong> What makes the work worth doing?</li><li><strong>Everyday words.</strong> Say it the way you’d explain it to someone over coffee.</li><li><strong>A little breathing room.</strong> Let the work carry part of the story.</li></ul><p>Try reading it aloud. The parts that don’t sound like you are the parts to change.</p>`;return `<p>Let’s make a little room for the idea before rushing to an answer.</p><h2>Start small. Stay curious.</h2><p>The most useful notes aren’t a record of everything. They’re a conversation with the parts that stayed with you.</p><h3>Try a three-part note</h3><ul><li><strong>What caught my attention?</strong> One idea, in your own words.</li><li><strong>What does it connect to?</strong> A project, a question, or something you’ve experienced.</li><li><strong>What could I try?</strong> One small action that makes the idea tangible.</li></ul><blockquote>You don’t need a perfect system. You need a place to return to.</blockquote><p>Keep the first version short. You can always give a good idea more room later.</p>`}
function responseText(kind){const div=document.createElement('div');div.innerHTML=responseHTML(kind);return div.textContent}
function renderChat(){const c=chats.find(x=>x.id===state.chat);if(!c)return;$('#page').innerHTML=`<section class="chat" aria-label="Conversation">${c.messages.map((m,i)=>m.role==='user'?`<div class="user-message">${esc(m.text)}${m.files?.length?`<div class="small muted" style="margin-top:8px">${icon('file')} ${esc(m.files.join(', '))} · demo attachment</div>`:''}</div>`:`<article class="assistant-message"><div class="assistant-label">${mark()}<span>Kita</span><small>${esc(m.model||models.find(x=>x.id===state.model).name)}</small><span class="test-badge">Demo</span></div>${!m.streaming&&!m.stopped?`<details class="thinking-details"><summary class="thinking"><span class="status-dot"></span>Approach${icon('chevron','chevron')}</summary><p>This is a sample design response, not a model’s private reasoning. In the real app, this area can show a short task plan or progress summary.</p></details>`:''}<div class="response-body" id="response-${i}">${m.streaming||m.stopped?`<p>${esc(m.partial||'')}${m.streaming?'<span class="cursor"></span>':''}</p>`:responseHTML(m.kind)}</div>${m.streaming?`<div class="typing-status">${icon('refresh')}Simulating a response…</div>`:`<div class="response-actions"><button class="icon-button" data-copy="${i}" aria-label="Copy response" title="Copy response">${icon('copy')}</button><button class="icon-button" data-regenerate="${i}" aria-label="Regenerate demo response" title="Regenerate">${icon('refresh')}</button><button class="icon-button" data-edit="${i}" aria-label="Edit previous message" title="Edit message">${icon('pen')}</button><span class="response-meta">${m.stopped?'Stopped · Partial response':'Sample response · No tokens used'}</span></div>`}</article>`).join('')}</section>`}
function updateCounts(){$('#projectCount').textContent=projects.length;$('#libraryCount').textContent=library.length}
function updateComposer(){const model=models.find(m=>m.id===state.model);$('#modelName').textContent=model.name;const options=[];if(state.project){const p=projects.find(x=>x.id===state.project);if(p)options.push({key:'project',label:p.name,icon:'folder'})}if(state.search)options.push({key:'search',label:'Web search',icon:'globe'});if(state.thinking)options.push({key:'thinking',label:state.depth+' thinking',icon:'think'});if(state.skill!=='Auto')options.push({key:'skill',label:state.skill,icon:'spark'});state.attachments.forEach((a,i)=>options.push({key:'file-'+i,label:a,icon:'file'}));$('#contextLine').innerHTML=options.map(o=>`<div class="context-chip">${icon(o.icon)}<span>${esc(o.label)}</span><button data-remove-context="${o.key}" aria-label="Remove ${esc(o.label)}">${icon('close')}</button></div>`).join('');$('#contextLine').hidden=!options.length;const count=Number(state.search)+Number(state.thinking)+Number(state.skill!=='Auto');$('#toolCount').textContent=count;$('#toolCount').hidden=!count;$('#send').innerHTML=icon(state.generating?'stop':'up');$('#send').setAttribute('aria-label',state.generating?'Stop response':'Send message');$('#send').disabled=!state.generating&&!$('#prompt').value.trim();$('#prompt').disabled=state.generating;$('#prompt').style.height='auto';$('#prompt').style.height=Math.min(140,Math.max(44,$('#prompt').scrollHeight))+'px'}
function kindFor(text){if(/page|website|html|build|design|web|laman|bina|buat/i.test(text))return'artifact';if(/writ|word|story|introduc|clar|tulis|ayat/i.test(text))return'writing';return'general'}
function send(text){if(state.generating)return;const value=(text||$('#prompt').value).trim();if(!value)return;let c=chats.find(x=>x.id===state.chat);if(!c){c={id:'chat-'+(++serial),title:value.slice(0,42)+(value.length>42?'…':''),time:'Today',kind:kindFor(value),projectId:state.project,messages:[]};chats.unshift(c);state.chat=c.id}c.messages.push({role:'user',text:value,files:[...state.attachments]});state.attachments=[];state.page='chat';$('#prompt').value='';beginResponse(c,kindFor(value));render();$('#viewport').scrollTop=$('#viewport').scrollHeight}
function beginResponse(c,kind){state.generating=true;const message={role:'assistant',kind,partial:'',streaming:true,model:models.find(m=>m.id===state.model).name};c.messages.push(message);const text=responseText(kind);let pos=0;announce('Simulating a response. No provider request is made.');generationTimer=setInterval(()=>{if(!state.generating)return;pos+=18;message.partial=text.slice(0,pos);const box=$('#response-'+(c.messages.length-1));if(box){box.innerHTML=`<p>${esc(message.partial)}<span class="cursor"></span></p>`;const v=$('#viewport');if(v.scrollHeight-v.clientHeight-v.scrollTop<160)v.scrollTop=v.scrollHeight}if(pos>=Math.min(text.length,430)){clearInterval(generationTimer);generationTimer=null;message.streaming=false;state.generating=false;renderChat();updateComposer();announce('Demo response complete.')}},70)}
function regenerate(index){if(state.generating){toast('Stop the current response first.');return}const c=chats.find(x=>x.id===state.chat);if(!c)return;const kind=c.messages[index]?.kind||kindFor(c.messages[index-1]?.text||'');c.messages.splice(index);beginResponse(c,kind);renderChat();updateComposer()}
function editMessage(index){if(state.generating)return;const c=chats.find(x=>x.id===state.chat);const msg=c?.messages[index-1];if(!msg)return;openModal('edit','Edit your message','Try a different direction.',`<label class="field-label" for="editPrompt">Message</label><textarea id="editPrompt" style="width:100%;min-height:140px">${esc(msg.text)}</textarea>`,`<button class="button ghost" data-action="close-modal">Cancel</button><button class="button primary" id="editSubmit">Send again ${icon('up')}</button>`);$('#editSubmit').onclick=()=>{const text=$('#editPrompt').value.trim();if(!text)return;c.messages.splice(index-1);closeModal();send(text)}}
function renderProjects(){$('#page').innerHTML=`<section class="collection"><div class="collection-head"><div><h1>A place for each idea.</h1><p class="description">Keep related conversations and context together.</p></div><button class="button" data-action="new-project">${icon('plus')}<span>New project</span></button></div><div class="project-grid">${projects.map(p=>`<button class="project-card" data-project="${p.id}">${icon('folder')}${icon('arrow','project-arrow')}<h2>${esc(p.name)}</h2><p>${esc(p.description)}</p><small>${p.chats} conversations</small></button>`).join('')}</div><p class="session-note">A workspace preview, with sample projects. New projects stay in this preview session only.</p></section>`}
function openProject(id){state.project=id;state.page='home';state.chat=null;closeNav(false);render();$('#headerTitle').textContent=projects.find(p=>p.id===id).name;$('#viewport').scrollTop=0;focusPage()}
function newProject(){openModal('new-project','A new place to work','Give this idea a little room.',`<div class="field-stack"><label for="projectName">Project name</label><input id="projectName" placeholder="e.g. My next website" maxlength="60"><label for="projectDescription">A little context</label><textarea id="projectDescription" placeholder="What are you working towards?" rows="3" maxlength="220"></textarea></div>`,`<button class="button ghost" data-action="close-modal">Cancel</button><button class="button primary" id="createProject">Create project</button>`);$('#createProject').onclick=()=>{const name=$('#projectName').value.trim();if(!name){$('#projectName').focus();return}projects.push({id:'project-'+(++serial),name,description:$('#projectDescription').value.trim()||'A new space for your ideas.',chats:0});closeModal();navigate('projects');toast('Project created for this preview session.')}}
function renderLibrary(){const items=library.filter(x=>state.libraryTab==='all'||x.type===state.libraryTab);$('#page').innerHTML=`<section class="collection"><div class="collection-head"><div><h1>Keep the good things.</h1><p class="description">Your useful prompts and things you’ve made.</p></div></div><div class="tab-strip" role="tablist" aria-label="Library categories">${[['all','Everything'],['artifact','Artifacts'],['prompt','Prompts']].map(([id,label])=>`<button role="tab" aria-selected="${state.libraryTab===id}" class="${state.libraryTab===id?'active':''}" data-library-tab="${id}">${label}</button>`).join('')}</div><div class="library-list">${items.map(item=>`<button class="library-row" data-library-item="${item.id}">${icon(item.type==='artifact'?'code':'pen')}<span><strong>${esc(item.name)}</strong><small>${esc(item.description)}</small></span>${icon('arrow','trailing')}</button>`).join('')||'<p class="empty-list">Nothing saved here yet. Save an artifact from a conversation to keep it close.</p>'}</div><p class="session-note">Sample library. Nothing here reads or changes your existing Kita Chat data.</p></section>`}
function openModal(type,title,subtitle,body,footer='',className=''){if(!activeModal){previousFocus=document.activeElement;closeNav(false)}activeModal=type;$('#modalLayer').innerHTML=`<section class="dialog ${className}" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" tabindex="-1"><div class="dialog-head"><div><h2 class="dialog-title" id="dialogTitle">${esc(title)}</h2>${subtitle?`<p class="dialog-subtitle">${esc(subtitle)}</p>`:''}</div><button class="icon-button" data-action="close-modal" aria-label="Close dialog">${icon('close')}</button></div>${body!==null?`<div class="dialog-body">${body}</div>`:''}${footer?`<div class="dialog-footer">${footer}</div>`:''}</section>`;$('#modalLayer').hidden=false;$('#app').inert=true;requestAnimationFrame(()=>{if(!activeModal)return;const input=$('input:not([type=hidden]),textarea',$('#modalLayer'));(innerWidth>760&&input?input:$('.dialog')).focus({preventScroll:true})})}
function closeModal(){if(!activeModal)return;activeModal=null;$('#modalLayer').hidden=true;$('#modalLayer').innerHTML='';$('#app').inert=false;if(previousFocus?.isConnected&&!previousFocus.closest('[inert]'))previousFocus.focus();else $('.mobile-menu').offsetParent?$('.mobile-menu').focus():$('#themeQuick').focus()}
function openModels(){openModal('models','Choose your model','Different minds for different kinds of work.',`<div class="search-field">${icon('search')}<input id="modelSearch" placeholder="Search models or providers…" aria-label="Search models or providers"></div><div id="modelOptions"></div><div class="callout">${icon('info')}<span>Example models only. Choosing one changes this preview, not a real provider connection.</span></div>`);renderModels('');$('#modelSearch').oninput=e=>renderModels(e.target.value)}
function renderModels(query){const list=models.filter(m=>(m.name+' '+m.provider).toLowerCase().includes(query.toLowerCase()));$('#modelOptions').innerHTML=list.map(m=>`<button class="model-option ${state.model===m.id?'chosen':''}" data-model="${m.id}" aria-pressed="${state.model===m.id}"><span class="provider-mark">${m.letter}</span><span><strong>${m.name}</strong><small>${m.provider} · ${m.desc}</small></span>${state.model===m.id?icon('check'):`<span class="context">${m.context}</span>`}</button>`).join('')||'<p class="empty-list">No models found. Try a provider name.</p>'}
function openTools(){openModal('tools','A little extra capability','Choose what this conversation needs.',`<div class="tool-row">${icon('globe')}<div><strong>Search the web</strong><p>Bring current information into the conversation.</p></div><button class="switch" role="switch" aria-label="Search the web" aria-checked="${state.search}" data-toggle="search"><span class="switch-track"></span></button></div><div class="tool-row">${icon('think')}<div><strong>Think it through</strong><p>Give complex questions a little more room.</p></div><button class="switch" role="switch" aria-label="Think it through" aria-checked="${state.thinking}" data-toggle="thinking"><span class="switch-track"></span></button></div><div id="depthArea" ${state.thinking?'':'hidden'}><span class="field-label">Reasoning depth</span><div class="choice-pills">${['Quick','Balanced','Deep'].map(d=>`<button data-depth="${d}" class="${state.depth===d?'active':''}" aria-pressed="${state.depth===d}">${d}</button>`).join('')}</div></div><span class="field-label">A skill for the task</span><div class="choice-pills">${['Auto','Writing','Frontend','Research'].map(s=>`<button data-skill="${s}" class="${state.skill===s?'active':''}" aria-pressed="${state.skill===s}">${s}</button>`).join('')}</div><div class="callout">${icon('info')}<span>These controls demonstrate the new layout. Search, reasoning and skills do not call external services in this preview.</span></div>`,`<button class="button ghost" id="resetTools">Reset</button><button class="button primary" data-action="close-modal">Done ${icon('check')}</button>`);$('#resetTools').onclick=()=>{state.search=false;state.thinking=false;state.skill='Auto';state.depth='Balanced';openTools();updateComposer()}}
function openSettings(tab='connections'){state.settingsTab=tab;openModal('settings','Make it yours','A quieter workspace, your way.',null,'','wide');$('.dialog').insertAdjacentHTML('beforeend',`<div class="settings-layout"><nav class="settings-nav" aria-label="Settings sections">${[['connections','link','Connections'],['appearance','sun','Appearance'],['workspace','folder','Workspace'],['about','info','About']].map(([id,i,t])=>`<button data-settings-tab="${id}" class="${tab===id?'active':''}">${icon(i)}${t}</button>`).join('')}</nav><div class="settings-content" id="settingsContent"></div></div>`);renderSettingsContent()}
function renderSettingsContent(){const tab=state.settingsTab;$$('[data-settings-tab]').forEach(b=>b.classList.toggle('active',b.dataset.settingsTab===tab));const target=$('#settingsContent');if(tab==='connections')target.innerHTML=`<h3>Your AI connections</h3><p class="muted">Bring your own provider. Keep the choice yours.</p>${['Anthropic','OpenAI'].map((p,i)=>`<div class="provider-card"><div class="provider-card-top"><span class="provider-mark">${p[0]}</span><span><strong>${p}</strong><small>${i?'api.openai.com':'api.anthropic.com'}</small></span><span class="demo-tag">Example</span></div><div class="provider-actions"><button class="button" data-test-connection="${i}">${icon('refresh')}Simulate test</button><span class="connection-status" id="connectionStatus${i}">Not tested</span></div></div>`).join('')}<button class="button add-connection" id="addConnection">${icon('plus')}Add demo connection</button><div id="connectionForm" hidden></div><div class="callout">${icon('lock')}<span>No API keys here. Connections are simulated, and no network test is performed. Never enter a real secret in this prototype.</span></div>`;else if(tab==='appearance')target.innerHTML=`<h3>Set the mood</h3><p class="muted">Comfortable in the morning. Easy on the eyes at night.</p><div class="theme-grid">${['light','dark','system'].map(t=>`<button class="theme-option ${state.theme===t?'active':''}" data-theme-option="${t}" aria-pressed="${state.theme===t}"><div class="theme-mini ${t}"></div><span>${t[0].toUpperCase()+t.slice(1)}</span></button>`).join('')}</div><div class="settings-row"><div><strong>Conversation text</strong><p>A little more room to read.</p></div><select id="textSize" aria-label="Conversation text size"><option ${state.fontSize==='Default'?'selected':''}>Default</option><option ${state.fontSize==='Larger'?'selected':''}>Larger</option></select></div><div class="callout">${icon('info')}<span>Appearance is saved for this preview only. Your existing Kita Chat theme stays unchanged.</span></div>`;else if(tab==='workspace')target.innerHTML=`<h3>Your space, kept simple</h3><p class="muted">A clear distinction between your conversations and your app preferences.</p><div class="settings-row">${icon('folder')}<div><strong>Projects</strong><p>Keep conversations together around an idea.</p></div><button class="icon-button" data-settings-go="projects" aria-label="Open projects">${icon('arrow')}</button></div><div class="settings-row">${icon('library')}<div><strong>Library</strong><p>Prompts and artifacts worth coming back to.</p></div><button class="icon-button" data-settings-go="library" aria-label="Open library">${icon('arrow')}</button></div><div class="settings-row">${icon('settings')}<div><strong>Conversation controls</strong><p>Search, thinking and skills now live in Tools, right beside your message.</p></div></div><div class="callout">${icon('lock')}<span>Chats, projects and attachments in this prototype are session-only examples. Nothing is imported from the installed app.</span></div>`;else target.innerHTML=`${mark('mark about-mark')}<h3>Kita Chat, reimagined.</h3><p class="about-copy">A little space to think clearly, find the right words, and make something of your ideas.</p><p class="about-copy">This is an interactive frontend concept, not a new app release. Model replies, connection tests and artifacts use demonstration content.</p><div class="settings-row"><div><strong>Studio preview</strong><p>Independent of Kita Chat v4.2.2</p></div><span class="demo-tag">Concept 01</span></div><div class="callout">${icon('lock')}<span>No native bridges, real API keys, uploads, recording, or app updates. Only appearance preferences are stored.</span></div>`;if(tab==='connections')$('#addConnection').onclick=()=>{const f=$('#connectionForm');f.hidden=!f.hidden;if(!f.hidden){f.innerHTML=`<div class="provider-form"><label for="demoConnectionName">A demo connection name (not an API key)</label><input id="demoConnectionName" maxlength="40" placeholder="e.g. My local model"><button class="button" id="saveDemoConnection">Add example</button></div>`;$('#saveDemoConnection').onclick=()=>{const input=$('#demoConnectionName'),name=input.value.trim();if(!name){input.focus();return}if(/sk-|Bearer|api[_ -]?key/i.test(name)){input.value='';toast('Use a label only — never a real API key.');return}$('#addConnection').insertAdjacentHTML('beforebegin',`<div class="provider-card"><div class="provider-card-top"><span class="provider-mark">${icon('link')}</span><span><strong>${esc(name)}</strong><small>Demo connection · Session only</small></span><span class="demo-tag">Example</span></div></div>`);f.hidden=true;f.innerHTML='';toast('Demo connection added. No credentials stored.')}}};if(tab==='appearance')$('#textSize').onchange=e=>{state.fontSize=e.target.value;setTextSize()}}
function setTextSize(){let style=$('#textSizeOverride');if(!style){style=document.createElement('style');style.id='textSizeOverride';document.head.appendChild(style)}style.textContent=state.fontSize==='Larger'?'.response-body{font-size:18px!important}.user-message{font-size:17px!important}':''}
function openArtifact(){artifactTab='preview';artifactMobile=false;openModal('artifact','A quieter landing page','HTML artifact · Studio website',null,`<p>Sample artifact. Isolated from the app.</p><button class="button primary" data-action="save-artifact">${icon('save')}Save to library</button>`,'artifact-dialog');const panel=$('.dialog');panel.insertAdjacentHTML('beforeend',`<div class="artifact-toolbar"><div class="segmented" role="tablist" aria-label="Artifact view"><button role="tab" aria-selected="true" class="active" data-artifact-tab="preview">Preview</button><button role="tab" aria-selected="false" data-artifact-tab="code">Code</button></div><div class="segmented viewport-controls" aria-label="Preview width"><button class="active" data-artifact-width="full" aria-label="Full width" aria-pressed="true">${icon('desktop')}</button><button data-artifact-width="mobile" aria-label="Phone width" aria-pressed="false">${icon('phone')}</button></div><button class="icon-button" data-action="copy-code" aria-label="Copy artifact code">${icon('copy')}</button></div><div class="artifact-stage" id="artifactStage"><iframe title="Sample studio landing page" sandbox=""></iframe><pre hidden><code></code></pre></div>`);panel.appendChild($('.dialog-footer',panel));$('#artifactStage iframe').srcdoc=artifactHTML;$('#artifactStage code').textContent=artifactHTML}
async function copyText(text){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';(activeModal?$('.dialog'):document.body).appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw Error('Copy unavailable')}toast('Copied to clipboard.')}catch(e){toast('Clipboard unavailable in this preview browser.')}}
function focusables(root){return $$('button:not(:disabled),a[href],input:not(:disabled),textarea:not(:disabled),select:not(:disabled),[tabindex="0"],summary',root).filter(el=>el.getClientRects().length&&!el.closest('[hidden],[inert]'))}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(activeModal)closeModal();else if($('#sidebar').classList.contains('open'))closeNav();return}if(e.key==='Tab'){const root=activeModal?$('.dialog'):$('#sidebar').classList.contains('open')?$('#sidebar'):null;if(root){const list=focusables(root);if(!list.length){e.preventDefault();root.focus();return}const first=list[0],last=list.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===root||!root.contains(document.activeElement))){e.preventDefault();last.focus()}else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===root||!root.contains(document.activeElement))){e.preventDefault();first.focus()}}}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(activeModal)closeModal();newChat()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.action){const actions={'new':newChat,'open-nav':openNav,'close-nav':()=>closeNav(),'theme':toggleTheme,'settings':()=>openSettings(),'models':openModels,'tools':openTools,'attach':()=>{if(state.generating)return;$('#fileInput').click()},'close-modal':closeModal,'artifact':openArtifact,'new-project':newProject,'search-history':()=>{$('#historySearch').hidden=!$('#historySearch').hidden;if(!$('#historySearch').hidden)$('#historySearch').focus();else{$('#historySearch').value='';renderHistory()}},'copy-code':()=>copyText(artifactHTML),'save-artifact':()=>{if(!library.some(x=>x.id==='artifact-1'))library.unshift({id:'artifact-1',type:'artifact',name:'A quieter landing page',description:'HTML · Studio website',content:'artifact'});updateCounts();b.innerHTML=icon('check')+'Saved to library';toast('Kept in your preview library.');if(state.page==='library')renderLibrary()}};actions[d.action]?.()}
if(d.page)navigate(d.page);if(d.chat)openChat(d.chat);if(d.project)openProject(d.project);if(d.starter){const values={writing:'Help me introduce a small design studio without sounding like every other agency.',artifact:'Design a simple landing page for a creative studio. Make it feel thoughtful, natural, and a little different.',general:'How can I turn reading notes into ideas I actually use?'};send(values[d.starter])}if(d.model){state.model=d.model;updateComposer();closeModal();announce('Model selected: '+models.find(m=>m.id===d.model).name)}if(d.toggle){state[d.toggle]=!state[d.toggle];b.setAttribute('aria-checked',String(state[d.toggle]));if(d.toggle==='thinking')$('#depthArea').hidden=!state.thinking;updateComposer()}if(d.depth){state.depth=d.depth;$$('[data-depth]').forEach(x=>{x.classList.toggle('active',x.dataset.depth===state.depth);x.setAttribute('aria-pressed',String(x.dataset.depth===state.depth))});updateComposer()}if(d.skill){state.skill=d.skill;$$('[data-skill]').forEach(x=>{x.classList.toggle('active',x.dataset.skill===state.skill);x.setAttribute('aria-pressed',String(x.dataset.skill===state.skill))});updateComposer()}if(d.removeContext){const key=d.removeContext;if(key.startsWith('file-'))state.attachments.splice(Number(key.slice(5)),1);else if(key==='skill')state.skill='Auto';else if(key==='project')state.project=null;else state[key]=false;updateComposer()}if(d.settingsTab){state.settingsTab=d.settingsTab;renderSettingsContent()}if(d.themeOption){applyTheme(d.themeOption);$$('[data-theme-option]').forEach(x=>{x.classList.toggle('active',x.dataset.themeOption===d.themeOption);x.setAttribute('aria-pressed',String(x.dataset.themeOption===d.themeOption))})}if(d.settingsGo){closeModal();navigate(d.settingsGo)}if(d.libraryTab){state.libraryTab=d.libraryTab;renderLibrary()}if(d.libraryItem){const item=library.find(x=>x.id===d.libraryItem);if(item.type==='artifact')openArtifact();else{newChat();$('#prompt').value=item.content;updateComposer();$('#prompt').focus()}}if(d.testConnection!==undefined){b.disabled=true;const s=$('#connectionStatus'+d.testConnection);s.textContent='Simulating…';setTimeout(()=>{if(!b.isConnected)return;b.disabled=false;s.textContent='Demo test passed';s.classList.add('ok');toast('Simulation only. No provider was contacted.')},700)}if(d.artifactTab){artifactTab=d.artifactTab;$$('[data-artifact-tab]').forEach(x=>{x.classList.toggle('active',x.dataset.artifactTab===artifactTab);x.setAttribute('aria-selected',String(x.dataset.artifactTab===artifactTab))});$('#artifactStage iframe').hidden=artifactTab!=='preview';$('#artifactStage pre').hidden=artifactTab!=='code';$('.viewport-controls').hidden=artifactTab!=='preview'}if(d.artifactWidth){artifactMobile=d.artifactWidth==='mobile';$('#artifactStage iframe').classList.toggle('mobile-size',artifactMobile);$$('[data-artifact-width]').forEach(x=>{x.classList.toggle('active',x.dataset.artifactWidth===d.artifactWidth);x.setAttribute('aria-pressed',String(x.dataset.artifactWidth===d.artifactWidth))})}if(d.copy!==undefined){const m=chats.find(c=>c.id===state.chat)?.messages[Number(d.copy)];if(m)copyText(m.stopped?m.partial:responseText(m.kind))}if(d.regenerate!==undefined)regenerate(Number(d.regenerate));if(d.edit!==undefined)editMessage(Number(d.edit))});
$('#send').onclick=()=>state.generating?stopGeneration():send();$('#prompt').oninput=updateComposer;$('#prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&innerWidth>760){e.preventDefault();send()}};$('#historySearch').oninput=renderHistory;$('#drawerScrim').onclick=()=>closeNav();$('#modalLayer').addEventListener('click',e=>{if(e.target===$('#modalLayer'))closeModal()});$('#fileInput').onchange=e=>{const files=[...e.target.files].slice(0,4);state.attachments.push(...files.map(f=>f.name));state.attachments=state.attachments.slice(0,4);e.target.value='';updateComposer();toast('Filenames added for the demo. Files are not read or uploaded.')};window.addEventListener('resize',()=>{syncSidebar();if(state.page==='home'&&!state.project)$('#headerTitle').textContent=innerWidth<=760?'Kita Chat':'Your workspace'});hydrate();applyTheme(state.theme);syncSidebar();render();
</script>
